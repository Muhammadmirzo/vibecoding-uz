# Naqsh on a plain VPS (any provider). Guide: docs/ops/PORTABILITY.md, owner guide: docs/ops/KOCHIRISH.md.
#
#   cp .env.example .env.production && chmod 600 .env.production   # fill real values (never commit)
#   docker compose --env-file .env.production up -d --build         # app + caddy (TLS) + cron
#   docker compose --env-file .env.production --profile local-db up -d   # …plus Postgres 17 on this VPS
#
# Only Caddy is published to the internet. The app port stays on the private network, so client-sent
# proxy headers cannot reach the app unfiltered (see deploy/Caddyfile).
name: naqsh

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_TELEGRAM_BOT_NAME: ${NEXT_PUBLIC_TELEGRAM_BOT_NAME:-}
        NEXT_PUBLIC_TELEGRAM_WIDGET: ${NEXT_PUBLIC_TELEGRAM_WIDGET:-}
      secrets:
        - database_url
    image: naqsh-app:latest
    env_file: .env.production
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - "3000"
    volumes:
      - next_cache:/app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN (e.g. naqsh.uz) in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for Let's Encrypt}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

  # Replaces Vercel Crons: calls /api/cron/* with CRON_SECRET on the schedule in deploy/crontab.txt.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on: [app]
    command: ["/bin/sh", "/deploy/cron.sh"]
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      APP_URL: http://app:3000
    volumes:
      - ./deploy/cron.sh:/deploy/cron.sh:ro
      - ./deploy/crontab.txt:/deploy/crontab.txt:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [web]

  # Optional self-hosted Postgres 17. App URL: postgres://naqsh:<POSTGRES_PASSWORD>@db:5432/naqsh
  # Published on the VPS loopback only, so `npm run move -- db` can run on the VPS itself.
  db:
    profiles: [local-db]
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: naqsh
      POSTGRES_DB: naqsh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a long random POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naqsh -d naqsh"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [web]

secrets:
  database_url:
    environment: DATABASE_URL

networks:
  web: {}

volumes:
  next_cache: {}
  caddy_data: {}
  caddy_config: {}
  pgdata: {}
