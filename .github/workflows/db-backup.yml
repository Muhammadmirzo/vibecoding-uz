# Nightly encrypted database backup (the same snapshot + manifest code as move-db).
# The repo is PUBLIC: the artifact is only acceptable because it is age-encrypted; retention is short.
# Better long-term target: a private R2/S3 bucket (set BACKUP_S3_URI + keys, see docs/ops/KOCHIRISH.md).
name: db-backup
on:
  schedule:
    - cron: "17 19 * * *" # 00:17 Asia/Tashkent
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: db-ops
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: ./.github/actions/pg-tools
      - name: Dump + encrypt
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL || secrets.DATABASE_URL }}
          BACKUP_AGE_RECIPIENTS: ${{ vars.BACKUP_AGE_RECIPIENTS }}
        run: npx tsx scripts/ops/backup-db.ts --from SOURCE_DATABASE_URL --out "$RUNNER_TEMP/backup"
      - name: Upload encrypted backup (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: ${{ runner.temp }}/backup/*.age
          retention-days: 7
          if-no-files-found: error
      - name: Copy to private bucket (optional)
        env:
          BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "$BACKUP_S3_URI" ]; then echo "No BACKUP_S3_URI: artifact only"; exit 0; fi
          aws s3 cp "$RUNNER_TEMP/backup/" "$BACKUP_S3_URI" --recursive --exclude "*" --include "*.age" \
            ${BACKUP_S3_ENDPOINT:+--endpoint-url "$BACKUP_S3_ENDPOINT"}
      - name: Remove local files
        if: always()
        run: rm -rf "$RUNNER_TEMP/backup"
      - name: Alert owner on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: bash .github/scripts/alert.sh "nightly DB backup failed"
